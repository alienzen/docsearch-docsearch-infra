worker_processes auto;
events { worker_connections 2048; }

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;

    limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # Interface Vue 3 + DSFR (docsearch-ui-vue). Le service historique
    # "ui" n'est plus une bascule d'upstream : le profil "legacy" est
    # parti avec docker-compose lors de la migration vers Quadlet, il
    # n'a jamais eu d'unité systemd, et son dépôt est désormais archivé
    # en bundle git (voir README.md, § Architecture multi-dépôts).
    #
    # Le repli reste possible mais se monte à la main : restaurer le
    # dépôt, construire l'image et lancer le conteneur sur
    # docsearch-net (procédure complète dans README.md, § Architecture
    # multi-dépôts), puis pointer cet upstream sur "docsearch-ui:80" —
    # le 8082 de cette procédure est publié sur l'hôte, pas visible
    # d'ici.
    #
    # ⚠️ Nginx résout ce nom AU DÉMARRAGE et garde l'adresse : après
    # recréation du conteneur amont, un redémarrage de celui-ci est
    # indispensable, faute de quoi il sert l'ancienne IP — ou renvoie 502
    # si elle n'existe plus.
    upstream ui_backend {
        server ui-vue:80;
        keepalive 8;
    }

    # ── Redirection HTTP → HTTPS ───────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        # ⚠️  Ce nom devra être le FQDN réel avant toute mise en service du
        # SSO Kerberos : le navigateur dérive le SPN du nom d'hôte de l'URL
        # (HTTP/<fqdn>), et le certificat doit être émis pour ce même nom.
        # Voir PLAN-AUTH-SSO.md §2.5a.
        server_name docsearch.local;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options        DENY;
        add_header X-Content-Type-Options nosniff;

        client_max_body_size 50M;

        # Un ticket Kerberos d'AD transporte le PAC : l'en-tête
        # "Authorization: Negotiate" dépasse couramment 8 Ko. Sans ce
        # réglage, Nginx répond 400 sans rien journaliser d'explicite. À
        # relever DE PAIR avec --h11-max-incomplete-event-size côté uvicorn
        # (le plus bas des deux plafonds gagne), et à ne pas accompagner de
        # proxy_buffer_size / proxy_buffers : ceux-là concernent la réponse,
        # et posés seuls ils font refuser Nginx de démarrer.
        large_client_header_buffers 8 32k;

        # ──────────────────────────────────────────────────────
        # AUTHENTIFICATION — CE QUI A CHANGÉ
        #
        # Ce fichier portait huit blocs `auth_request` commentés
        # (« SSO — décommenter en production ») visant un Keycloak qui n'a
        # jamais été déployé, et qui devaient injecter un en-tête X-User
        # dans lequel l'API avait toute confiance.
        #
        # Ils sont retirés, et le contrôle ne vit plus ici : le jeton de
        # session est vérifié PAR L'APPLICATION, à chaque requête (voir
        # docsearch-api/app/auth/deps.py). Un mécanisme qui ne vit que dans
        # la configuration d'un proxy se déploie à moitié sans que
        # personne s'en aperçoive — et il est court-circuité par tout ce
        # qui atteint le service autrement, l'API publiant son port 8000.
        #
        # Ce proxy redevient donc ce qu'il est : TLS, limitation de débit,
        # routage. Il n'a plus AUCUN rôle d'authentification, et ne doit
        # jamais poser d'en-tête d'identité.
        # ──────────────────────────────────────────────────────

        # ── Interface web (docsearch-ui-vue) ───────────────────
        # Le conteneur d'interface garde son propre auth_request, qui garde
        # chaque page une par une (voir docsearch-ui-vue/nginx.conf).
        location / {
            proxy_pass         http://ui_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Authentification (docsearch-api) ───────────────────
        # Connexion, session, SSO Kerberos, JWKS.
        #
        # ⚠️  L'en-tête `Authorization` (ticket SPNEGO) traverse PAR DÉFAUT.
        # Un `proxy_pass_request_headers off;` ajouté ici couperait la
        # connexion automatique sans autre symptôme qu'un 401.
        location /auth/ {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── API de recherche (docsearch-api) ───────────────────
        location /search {
            limit_req zone=search burst=20 nodelay;

            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
            # Nécessaire pour la page de stats admin (/admin/search-logs) —
            # sans ça, l'API ne verrait que l'IP interne de Nginx, pas celle
            # du client (voir get_client_ip() dans docsearch-api).
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(document|health)(/|$) {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        location /saved-searches {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Routes personnelles : ce que l'utilisateur courant a lui-même
        # fait (historique de recherche). Préfixe et non chemin exact —
        # c'est là que viendront les suivantes.
        location /me/ {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Notifications in-app des recherches sauvegardées en alerte
        # (🔔 Alertes, voir index.html) — /alerts, /alerts/{id}/seen,
        # /alerts/mark-all-seen.
        location /alerts {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Collections de documents personnelles ("📋 Mes collections", voir index.html)
        location /collections {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # ── Mesure de satisfaction (pouce, tracking de clic, NPS,
        # suggestions) — /admin/engagement-config, /admin/nps-summary et
        # /admin/suggestions sont déjà couverts par "location /admin/".
        location ~ ^/(engagement-config|feedback|click|nps|suggestions)$ {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Présélection de sources avant recherche (voir index.html)
        location = /searchable-sources {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Facettes SQL personnalisées actives (ex: bureau/fonction),
        # pour la syntaxe avancée de la barre de recherche (voir index.html)
        location = /custom-facets {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Bascules d'interface (ex: visibilité du lien Assistant IA) —
        # /admin/ui-config est déjà couvert par "location /admin/".
        location = /ui-config {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }

        # Visibilité des liens Administration/Statistiques (voir index.html)
        location = /is-admin {
            proxy_pass       http://api_backend;
            proxy_set_header Host $host;
        }


        location /ask {
            # Endpoint RAG (chat.html) — timeout étendu pour l'inférence LLM
            proxy_pass          http://api_backend;
            proxy_read_timeout  120s;
        }

        location /metrics {
            proxy_pass          http://api_backend;
            proxy_set_header    Connection "";
            proxy_http_version  1.1;
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
        }

        location /api/preview/ {
            proxy_pass         http://api_backend;
            proxy_read_timeout 120s;
            proxy_buffering    off;
        }

        # ── Panneau d'administration — même API, contrôle d'accès
        # supplémentaire fait côté application : appartenance à
        # ADMIN_GROUP, vérifiée à partir du jeton de session (voir
        # docsearch-api/app/auth/deps.py::require_admin). Ce proxy ne
        # transmet aucune identité — le cookie de session suffit, et il
        # voyage seul.
        location /admin/ {
            proxy_pass         http://api_backend;
            proxy_read_timeout 60s;
        }

        location /kibana/ {
            allow  172.20.0.0/16;
            deny   all;
            proxy_pass http://kibana:5601/;
        }
    }
}
