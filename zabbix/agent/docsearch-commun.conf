# ─────────────────────────────────────────────────────────────
#  Sondes DocSearch communes aux 8 machines
#  → /etc/zabbix/zabbix_agent2.d/docsearch-commun.conf
#
#  Après modification : systemctl restart zabbix-agent2
# ─────────────────────────────────────────────────────────────

# État des unités systemd de la pile (Quadlet). Élément maître ET source
# de découverte : une seule exécution par intervalle, quel que soit le
# nombre d'unités de la machine.
UserParameter=docsearch.unites,/usr/local/bin/docsearch-zabbix-unites

# Santé des conteneurs vue de podman. sudo -n : jamais d'invite de mot de
# passe, l'agent n'a pas de terminal. Voir /etc/sudoers.d/zabbix-docsearch.
UserParameter=docsearch.conteneurs,/usr/bin/sudo -n /usr/local/bin/docsearch-zabbix-podman

# Synchronisation NTP. Des horloges qui divergent entre les 8 machines
# faussent les dates d'indexation et rendent les journaux incomparables.
UserParameter=docsearch.horloge,/usr/local/bin/docsearch-zabbix-horloge

# vm.max_map_count : appliqué partout par le guide d'installation, requis
# strictement par Elasticsearch. Un "sysctl -w" sans fichier dans
# /etc/sysctl.d retombe à 65530 au redémarrage suivant (§9.3 du guide).
UserParameter=docsearch.max_map_count,cat /proc/sys/vm/max_map_count

# Version de podman réellement installée : Quadlet exige 4.4 minimum, et
# c'est le genre de régression qu'une mise à jour de distribution amène
# sans prévenir.
UserParameter=docsearch.podman.version,podman --version 2>/dev/null | awk '{print $3}'
