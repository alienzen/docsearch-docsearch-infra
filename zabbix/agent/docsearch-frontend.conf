# ─────────────────────────────────────────────────────────────
#  Sondes DocSearch — machine frontend uniquement
#  → /etc/zabbix/zabbix_agent2.d/docsearch-frontend.conf
#
#  Prérequis : /etc/zabbix/docsearch-supervision.conf (0640 root:zabbix)
#  renseigné avec le compte local de supervision.
# ─────────────────────────────────────────────────────────────

# /health sur le port 8000 EN DIRECT, sans authentification. Comparé à
# docsearch.api.web, il distingue « Nginx est tombé » de « l'API est
# tombée » — les deux se présentent pareil vu de l'extérieur.
UserParameter=docsearch.api.sante,/usr/local/bin/docsearch-zabbix-api sante

# /admin/status : l'état agrégé de TOUS les composants de l'application,
# en un appel. Élément maître d'une vingtaine d'éléments dépendants.
UserParameter=docsearch.api.etat,/usr/local/bin/docsearch-zabbix-api etat

# Volumétrie indexée toutes sources confondues (/metrics).
UserParameter=docsearch.api.metriques,/usr/local/bin/docsearch-zabbix-api metriques

# Recherche réelle de bout en bout. La seule sonde qui mesure ce que
# l'utilisateur ressent. Ne pas descendre sous 1 min : Nginx limite
# /search à 30 req/min par IP.
UserParameter=docsearch.api.recherche,/usr/local/bin/docsearch-zabbix-api recherche

# La racine doit répondre 302 vers /connexion.
UserParameter=docsearch.api.web,/usr/local/bin/docsearch-zabbix-api web

# Les clés RS256 sont-elles lisibles par le service ? Un trousseau
# illisible donne un /auth/login en 503 alors que tout le reste va bien.
UserParameter=docsearch.api.jwks,/usr/local/bin/docsearch-zabbix-api jwks

# Expiration du certificat TLS présenté par Nginx (auto-signé, 365 jours
# par défaut : il expire un an après la mise en service).
UserParameter=docsearch.api.certificat,/usr/local/bin/docsearch-zabbix-api certificat

# Redis : mémoire, évictions, sauvegarde RDB, présence des registres de
# configuration et fraîcheur des battements de cœur d'ingestion.
UserParameter=docsearch.redis,/usr/bin/sudo -n /usr/local/bin/docsearch-zabbix-redis

# Partage réseau des sources, monté ici aussi pour l'aperçu de document.
UserParameter=docsearch.montage[*],/usr/local/bin/docsearch-zabbix-montage "$1"
