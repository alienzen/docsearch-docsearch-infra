# ─────────────────────────────────────────────────────────────
#  Sondes DocSearch — machines d'ingestion (ingest-1/2/3)
#  → /etc/zabbix/zabbix_agent2.d/docsearch-ingest.conf
# ─────────────────────────────────────────────────────────────

# Partage réseau des documents sources. Sa disparition est la panne la
# plus silencieuse de la pile : plus rien n'est indexé, et rien ne le
# signale — le watcher continue de battre, il ne voit simplement plus
# aucun fichier.
UserParameter=docsearch.montage[*],/usr/local/bin/docsearch-zabbix-montage "$1"

# Les serveurs Tika sont interrogés par le serveur Zabbix lui-même
# (net.tcp.service sur 9998/9999, ports publiés) : rien à déclarer ici.
