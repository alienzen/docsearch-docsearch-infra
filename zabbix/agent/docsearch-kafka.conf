# ─────────────────────────────────────────────────────────────
#  Sondes DocSearch — machine kafka
#  → /etc/zabbix/zabbix_agent2.d/docsearch-kafka.conf
# ─────────────────────────────────────────────────────────────

# File d'indexation vue du broker : topic, partitions, membres du groupe
# de consumers, retard total. Les mêmes chiffres que /admin/status, mais
# sans dépendre de l'API — donc encore mesurables quand elle est tombée.
#
# Appel lent (le coordinateur de groupe est interrogé) : Timeout=30 dans
# zabbix_agent2.conf, intervalle de 2 min côté modèle.
UserParameter=docsearch.kafka.file,/usr/bin/sudo -n /usr/local/bin/docsearch-zabbix-kafka
