        # ── Redis ──────────────────────────────────────────────
        - uuid: '7e0db88669bc4eb1bc25f31c25d182d2'
          name: 'Redis : collecte'
          key: 'docsearch.redis'
          delay: 1m
          history: 1h
          trends: '0'
          value_type: TEXT
          tags:
            - tag: composant
              value: redis

        - uuid: '480f5ffc13494056a0342bb7a0381280'
          name: 'Redis : joignable'
          type: DEPENDENT
          key: 'docsearch.redis.joignable'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.redis'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.joignable'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: redis
          triggers:
            - uuid: '910ae36203af4035ad2fd78557d5d55b'
              expression: 'min(/DocSearch frontend/docsearch.redis.joignable,3m)=0'
              name: 'Redis : injoignable'
              priority: HIGH
              description: |
                Redis porte les registres de sources, la configuration à chaud, les
                sessions et les compteurs de limitation de débit. Sans lui, /auth
                répond 503 et plus personne ne se connecte.
              tags:
                - tag: scope
                  value: redis

        - uuid: '543cb3c51bae4cb19576c80b8aaca0ae'
          name: 'Redis : clés évincées'
          type: DEPENDENT
          key: 'docsearch.redis.evictions'
          value_type: UNSIGNED
          master_item:
            key: 'docsearch.redis'
          description: |
            Compteur cumulé depuis le démarrage. Redis tourne avec
            --maxmemory-policy allkeys-lru : cette politique n'épargne AUCUNE
            clé — ni le registre des sources, ni la configuration à chaud, ni
            les sessions ouvertes.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.evictions'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: redis
          triggers:
            - uuid: '3438541bc7954e34ac730005989c45fc'
              expression: 'change(/DocSearch frontend/docsearch.redis.evictions)>0'
              name: 'Redis : des clés ont été évincées'
              priority: HIGH
              manual_close: 'YES'
              description: |
                Une seule éviction est un événement grave, pas une statistique :
                allkeys-lru peut faire disparaître le registre des sources, un
                filtre de chemins ou une session, sans aucune trace ailleurs.
                Relever --maxmemory, ou purger ce qui a grossi (historiques de
                recherche, alertes).
              tags:
                - tag: scope
                  value: redis

        - uuid: '37d02c33069d400d9f0d6da8ae413347'
          name: 'Redis : occupation mémoire'
          type: DEPENDENT
          key: 'docsearch.redis.memoire.pct'
          value_type: FLOAT
          units: '%'
          master_item:
            key: 'docsearch.redis'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memoire_pct'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: redis
          triggers:
            - uuid: 'bbb0bf2b198b48b6969afcdd56c70adf'
              expression: 'min(/DocSearch frontend/docsearch.redis.memoire.pct,15m)>{$DOCSEARCH.REDIS.MEMOIRE.MAX}'
              name: 'Redis : plus de {$DOCSEARCH.REDIS.MEMOIRE.MAX} % de maxmemory utilisés'
              priority: WARNING
              description: 'Avertissement avant les premières évictions. Agir maintenant coûte moins cher.'
              tags:
                - tag: scope
                  value: redis

        - uuid: 'a52eb3d5863445648efdcd3cf4eb524f'
          name: 'Redis : mémoire utilisée'
          type: DEPENDENT
          key: 'docsearch.redis.memoire'
          value_type: UNSIGNED
          units: B
          master_item:
            key: 'docsearch.redis'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.memoire_utilisee'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: redis

        - uuid: '55726c315d85492394e5b984c91ff67a'
          name: 'Redis : dernière sauvegarde RDB réussie'
          type: DEPENDENT
          key: 'docsearch.redis.rdb'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.redis'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.rdb_ok'
              error_handler: CUSTOM_VALUE
              error_handler_params: '1'
          tags:
            - tag: composant
              value: redis
          triggers:
            - uuid: '0508d7c0f1084fd0b1805cd7fdeb3a4d'
              expression: 'min(/DocSearch frontend/docsearch.redis.rdb,10m)=0'
              name: 'Redis : la sauvegarde sur disque échoue'
              priority: AVERAGE
              description: |
                Le volume redis-data ne reçoit plus de snapshot : au prochain
                redémarrage du conteneur, les registres de sources et la
                configuration à chaud repartiraient dans l'état du dernier
                snapshot réussi. Cause habituelle : disque plein.
              tags:
                - tag: scope
                  value: redis

        - uuid: 'fdf7d98e2a9741c5912d22b24c93b7a4'
          name: 'Redis : registre des sources fichier présent'
          type: DEPENDENT
          key: 'docsearch.redis.registre.sources'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.redis'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.registre_file_sources'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: redis
          triggers:
            - uuid: '4d22af04f0d74bf8a953207ef2d5fc76'
              expression: 'last(/DocSearch frontend/docsearch.redis.joignable)=1 and min(/DocSearch frontend/docsearch.redis.registre.sources,5m)=0'
              name: 'DocSearch : le registre des sources a disparu de Redis'
              priority: DISASTER
              description: |
                docsearch:config:file_sources n'existe plus alors que Redis répond.
                Plus aucune source n'est déclarée : ni indexation, ni facette de
                source, ni aperçu. Causes : éviction LRU, FLUSHDB, ou volume
                redis-data reparti à vide.
              tags:
                - tag: scope
                  value: redis

        - uuid: 'd8f9e1e6a09046d3a6c7b39cd385557f'
          name: 'Redis : clients connectés'
          type: DEPENDENT
          key: 'docsearch.redis.clients'
          value_type: UNSIGNED
          master_item:
            key: 'docsearch.redis'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.clients'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: redis

        - uuid: '1babfc198aff452097b384faa95642fb'
          name: 'Redis : silence du worker SQL'
          type: DEPENDENT
          key: 'docsearch.redis.battement.sql'
          value_type: FLOAT
          units: s
          master_item:
            key: 'docsearch.redis'
          description: '-1 = aucun battement (worker SQL non démarré, ce qui est le cas par défaut).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.battement_sql_worker_s'
              error_handler: CUSTOM_VALUE
              error_handler_params: '-1'
          tags:
            - tag: composant
