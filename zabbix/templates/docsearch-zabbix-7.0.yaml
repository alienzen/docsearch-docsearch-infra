        - uuid: 'cf4331c3872542abab8df0362d0cbcc5'
          name: 'Redis : silence du worker web'
          type: DEPENDENT
          key: 'docsearch.redis.battement.web'
          value_type: FLOAT
          units: s
          master_item:
            key: 'docsearch.redis'
          description: '-1 = aucun battement (worker web non démarré, ce qui est le cas par défaut).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.battement_web_worker_s'
              error_handler: CUSTOM_VALUE
              error_handler_params: '-1'
          tags:
            - tag: composant
              value: ingestion

        # ── Partage des sources (aperçu de document) ───────────
        - uuid: '337ea9bf9aef47dea468f246567c42b9'
          name: 'Sources : montage {$DOCSEARCH.SOURCES.CHEMIN}'
          key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          delay: 5m
          history: 1h
          trends: '0'
          value_type: TEXT
          tags:
            - tag: composant
              value: sources

        - uuid: '6772fa1ce50b49e5bf057aed2f4619fe'
          name: 'Sources : partage monté'
          type: DEPENDENT
          key: 'docsearch.montage.monte'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.monte'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: sources
          triggers:
            - uuid: 'f76c7ffdaa0f4990afdfa452055c404e'
              expression: 'min(/DocSearch frontend/docsearch.montage.monte,10m)=0'
              name: 'Sources : le partage réseau n''est plus monté'
              priority: AVERAGE
              description: |
                Sur frontend, ce partage sert l'aperçu de document (conversion
                Office → PDF) : les aperçus échouent, la recherche continue.
              tags:
                - tag: scope
                  value: sources

        - uuid: '1df7904871a148e48e567c781981d09c'
          name: 'Sources : partage lisible'
          type: DEPENDENT
          key: 'docsearch.montage.lisible'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.lisible'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: sources

        # ── Ports ──────────────────────────────────────────────
        - uuid: 'e517867277bc4ef6857a6c3b8c0bb557'
          name: 'Nginx : port 443'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,443]'
          delay: 1m
          value_type: UNSIGNED
          description: 'Contrôle TCP simple : la validité du certificat auto-signé est vérifiée à part.'
          tags:
            - tag: composant
              value: nginx

        - uuid: '3e337b23e6f84fa79e5ef0ff9823b839'
          name: 'Nginx : port 80'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,80]'
          delay: 5m
          value_type: UNSIGNED
          tags:
            - tag: composant
              value: nginx

        - uuid: 'ffa1db7ce70f42b6837c2b512b13fc2c'
          name: 'API : port 8000'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,8000]'
          delay: 1m
          value_type: UNSIGNED
          tags:
            - tag: composant
              value: api

        - uuid: 'e65d024f91414a609c3e6b6df577d157'
          name: 'Redis : port 6379'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,6379]'
          delay: 1m
          value_type: UNSIGNED
          description: |
            Interrogé depuis le serveur Zabbix : c'est le chemin qu'empruntent les
            workers des 3 machines d'ingestion pour lire la configuration à chaud.
            Un pare-feu qui se referme se voit ici et nulle part ailleurs.
          tags:
            - tag: composant
              value: redis

      discovery_rules:

        - uuid: '85cca5dc0f5e407ab597b970f3aad29c'
          name: 'Sources DocSearch'
          type: DEPENDENT
          key: 'docsearch.sources.decouverte'
          description: |
            Une entrée par source enregistrée (fichier, SQL, web). /admin/status
            rend un objet indexé par nom : converti ici en tableau, seule forme
            que la découverte de bas niveau sait lire.
          master_item:
            key: 'docsearch.api.etat'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var s = (d.donnees && d.donnees.sources) ? d.donnees.sources : {};
                  var r = [];
                  for (var nom in s) {
                      r.push({nom: nom,
                              index_es: s[nom].es_index || '',
                              libelle: s[nom].label || nom});
                  }
                  return JSON.stringify(r);
          lld_macro_paths:
            - lld_macro: '{#SOURCE}'
              path: '$.nom'
            - lld_macro: '{#INDEX_ES}'
              path: '$.index_es'
            - lld_macro: '{#LIBELLE}'
              path: '$.libelle'
          item_prototypes:
            - uuid: 'b5203560201348d6abd38ba14aa48d59'
              name: 'Source {#LIBELLE} : documents indexés'
              type: DEPENDENT
              key: 'docsearch.source.documents[{#SOURCE}]'
              value_type: UNSIGNED
              master_item:
                key: 'docsearch.api.etat'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$.donnees.sources['{#SOURCE}'].indexed"
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              tags:
                - tag: composant
                  value: application
                - tag: source
                  value: '{#SOURCE}'
          trigger_prototypes:
            - uuid: '3797e986b228487fba89437fa0b2429a'
              expression: 'last(/DocSearch frontend/docsearch.etat.http)=200 and max(/DocSearch frontend/docsearch.source.documents[{#SOURCE}],1h)=0'
              name: 'Source {#SOURCE} : aucun document indexé depuis 1 h'
              priority: WARNING
              description: |
                Source enregistrée mais son index est vide. Normal juste après
                l'enregistrement, anormal ensuite : index supprimé, ou scan jamais
                lancé pour cette source.
              tags:
                - tag: scope
                  value: application

    # ═══════════════════════════════════════════════════════════
    #  6. INGESTION — ingest-1, ingest-2, ingest-3
    # ═══════════════════════════════════════════════════════════
    - uuid: '76cb77709507487ebce758a6bc15cdaa'
      template: 'DocSearch ingestion'
      name: 'DocSearch ingestion'
      description: |
        Sondes des machines d'ingestion : les deux serveurs Tika et le partage
        réseau des documents sources. Les workers eux-mêmes sont vus par le
        modèle "DocSearch socle" (unités systemd) et, côté file, par
        "DocSearch Kafka".
      groups:
        - name: 'Templates/DocSearch'

      macros:
        - macro: '{$DOCSEARCH.SOURCES.CHEMIN}'
          value: '/data/docsearch-sources'

      valuemaps:
        - uuid: 'e8c8b9cf470248de8b3a178bdf6db4f3'
          name: 'Oui non'
          mappings:
            - value: '0'
              newvalue: 'Non'
            - value: '1'
              newvalue: 'Oui'

      items:

        - uuid: '934f0e6b2bf748ed9553fa75f191f6d7'
          name: 'Tika A : port 9998'
          type: SIMPLE
          key: 'net.tcp.service[http,,9998]'
          delay: 1m
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          description: |
            Les images officielles apache/tika n'embarquent aucun outil HTTP
            utilisable (TIKA-3333) : pas de HealthCmd possible dans l'unité
            Quadlet. Le contrôle se fait donc depuis l'extérieur, sur le port
            publié — ce qui teste au passage exactement le chemin qu'empruntent
            les workers des autres machines d'ingestion.
          tags:
            - tag: composant
              value: tika

        - uuid: '89ed08507bff4f1bbce739e82b76722b'
          name: 'Tika B : port 9999'
          type: SIMPLE
          key: 'net.tcp.service[http,,9999]'
          delay: 1m
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          tags:
            - tag: composant
              value: tika
          triggers:
            - uuid: '5907be2a9fb0499dac5b98a73cce427e'
              expression: 'min(/DocSearch ingestion/net.tcp.service[http,,9998],5m)=0 and min(/DocSearch ingestion/net.tcp.service[http,,9999],5m)=0'
              name: 'Tika : les deux instances de cette machine sont muettes'
              priority: AVERAGE
              description: |
                Les 4 instances des deux autres machines d'ingestion prennent le
                relais : l'extraction continue, plus lentement. Devient HIGH via
                l'agrégat du modèle "DocSearch application" si toutes tombent.
              tags:
                - tag: scope
                  value: tika

        - uuid: 'ad33e3f936ba49a2b35830d487a3bf3f'
          name: 'Tika A : temps de réponse'
          type: SIMPLE
          key: 'net.tcp.service.perf[http,,9998]'
          delay: 1m
          value_type: FLOAT
          units: s
          tags:
            - tag: composant
              value: tika

        - uuid: '9dce2e4caa004b76bf87ccb28c9984c3'
          name: 'Tika B : temps de réponse'
          type: SIMPLE
          key: 'net.tcp.service.perf[http,,9999]'
          delay: 1m
          value_type: FLOAT
          units: s
          tags:
            - tag: composant
              value: tika

        - uuid: '91d2813f829e4d9ba4facdfe57361e47'
          name: 'Sources : montage {$DOCSEARCH.SOURCES.CHEMIN}'
          key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          delay: 5m
          history: 1h
          trends: '0'
          value_type: TEXT
          tags:
            - tag: composant
              value: sources

        - uuid: '58000331c0b24f79b99ff6baedc937aa'
          name: 'Sources : partage monté'
          type: DEPENDENT
          key: 'docsearch.montage.monte'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.monte'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: sources
          triggers:
            - uuid: 'd111c6ba894d4c82a507b40098d3cb0d'
              expression: 'min(/DocSearch ingestion/docsearch.montage.monte,10m)=0'
              name: 'Sources : le partage réseau n''est plus monté'
              priority: HIGH
              description: |
                La panne la plus silencieuse de la pile. Le watcher continue de
                battre et les workers de tourner ; il n'y a simplement plus aucun
                fichier à voir. Aucune erreur nulle part, et l'indexation s'arrête.
                Remède : mount -a, puis vérifier /etc/fstab et le serveur de fichiers.
              tags:
                - tag: scope
                  value: sources

        - uuid: 'b2d8c200967b4aa0b9564b1fe6af112c'
          name: 'Sources : partage lisible'
          type: DEPENDENT
          key: 'docsearch.montage.lisible'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          description: |
            Distinct de "monté" : une poignée CIFS périmée laisse le montage en
            place mais toute lecture échoue ou reste bloquée. Le remède n'est
            pas le même (remontage, pas simple mount -a).
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.lisible'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          tags:
            - tag: composant
              value: sources
          triggers:
            - uuid: 'c6220328e3c54ba59327e33b3cc7c50d'
              expression: 'last(/DocSearch ingestion/docsearch.montage.monte)=1 and min(/DocSearch ingestion/docsearch.montage.lisible,10m)=0'
              name: 'Sources : le partage est monté mais illisible'
              priority: HIGH
              description: 'Poignée CIFS périmée ou droits modifiés côté serveur de fichiers. Remonter le partage.'
              tags:
                - tag: scope
                  value: sources

        - uuid: '3e73708be8374fed86404c53fcc7fe91'
          name: 'Sources : partage vide'
          type: DEPENDENT
          key: 'docsearch.montage.vide'
          value_type: UNSIGNED
          valuemap:
            name: 'Oui non'
          master_item:
            key: 'docsearch.montage[{$DOCSEARCH.SOURCES.CHEMIN}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vide'
              error_handler: CUSTOM_VALUE
              error_handler_params: '1'
          tags:
            - tag: composant
              value: sources

    # ═══════════════════════════════════════════════════════════
    #  7. APPLICATION — hôte logique, sans agent
    #
    #  Deux familles d'éléments :
    #    • l'état du CLUSTER Elasticsearch, relevé une seule fois
    #      (le relever sur chaque nœud le ferait sonner trois fois) ;
    #    • les agrégats inter-machines, seuls capables de voir ce
    #      qu'aucune machine ne voit seule : le watcher démarré deux
    #      fois, les 6 Tika tombés ensemble, les 9 workers réduits à 3.
    #
    #  À lier sur un hôte SANS interface, par exemple "DocSearch —
    #  application", membre du groupe "DocSearch/application".
    #  Les agrégats visent des groupes d'hôtes nommés en dur : respecter
    #  les noms de groupes du README §2.
    # ═══════════════════════════════════════════════════════════
    - uuid: '23c7fd4d101242db9ce466517613df2c'
      template: 'DocSearch application'
      name: 'DocSearch application'
      description: |
        État du cluster Elasticsearch et agrégats inter-machines. À lier sur un
        hôte logique sans interface. Aucun agent requis.
      groups:
        - name: 'Templates/DocSearch'

      macros:
        - macro: '{$DOCSEARCH.ES.URL}'
          value: 'http://192.168.10.11:9200'
          description: |
            Un nœud de données joignable, à adapter. C'est aussi celui que
            désigne ES_HOST côté API — utiliser le même rend la sonde
            représentative de ce que voit l'application.
        - macro: '{$DOCSEARCH.ES.ALIAS}'
          value: 'docsearch-all'
        - macro: '{$DOCSEARCH.ES.NOEUDS.ATTENDUS}'
          value: '3'
        - macro: '{$DOCSEARCH.TIKA.ATTENDUS}'
          value: '6'
        - macro: '{$DOCSEARCH.TIKA.MIN}'
          value: '4'
        - macro: '{$DOCSEARCH.WORKERS.MIN}'
          value: '9'
        - macro: '{$DOCSEARCH.DOCS.CHUTE.MAX}'
          value: '10000'
          description: 'Chute du nombre de documents indexés, entre deux relevés, jugée anormale.'

      valuemaps:
        - uuid: '5e30261b384640c2af161c55f2cdab8b'
          name: 'Etat cluster ES'
          mappings:
            - value: '0'
              newvalue: 'Vert'
            - value: '1'
              newvalue: 'Jaune'
            - value: '2'
              newvalue: 'Rouge'

      items:

        - uuid: 'f85546ade15444ca973deea3bfa0c2a8'
          name: 'Cluster ES : santé'
          type: HTTP_AGENT
          key: 'es.cluster.sante'
          url: '{$DOCSEARCH.ES.URL}/_cluster/health'
          delay: 1m
          timeout: 15s
          history: 1h
          trends: '0'
          value_type: TEXT
          tags:
            - tag: composant
              value: elasticsearch

        - uuid: 'c7287cbcaff8499888dacb19786a4bd9'
          name: 'Cluster ES : état'
          type: DEPENDENT
          key: 'es.cluster.etat'
          value_type: UNSIGNED
          valuemap:
            name: 'Etat cluster ES'
          master_item:
            key: 'es.cluster.sante'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var t = {green: 0, yellow: 1, red: 2};
                  return t[d.status] === undefined ? 2 : t[d.status];
          tags:
            - tag: composant
              value: elasticsearch
          triggers:
            - uuid: '7f4e303756f64792b08ae221a583984f'
              expression: 'last(/DocSearch application/es.cluster.etat)=2'
              name: 'Elasticsearch : cluster ROUGE'
              priority: DISASTER
              description: |
                Au moins un shard primaire est indisponible : une partie du corpus
                ne peut plus être ni cherchée ni indexée.
                GET /_cluster/allocation/explain donne la raison exacte.
              tags:
                - tag: scope
                  value: elasticsearch
            - uuid: '273430043e114ff0a54167172e51c8cb'
              expression: 'min(/DocSearch application/es.cluster.etat,15m)=1'
              name: 'Elasticsearch : cluster JAUNE depuis 15 min'
              priority: AVERAGE
              description: |
                Réplicas non assignés : la recherche fonctionne, la redondance non.
                Normal quelques minutes après le redémarrage d'un nœud, anormal ensuite.
              tags:
                - tag: scope
                  value: elasticsearch

        - uuid: 'ce56a1fad60e40ac84b1effd3f31586e'
          name: 'Cluster ES : nœuds'
          type: DEPENDENT
          key: 'es.cluster.noeuds'
          value_type: UNSIGNED
          master_item:
            key: 'es.cluster.sante'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.number_of_nodes'
          tags:
            - tag: composant
              value: elasticsearch
          triggers:
            - uuid: '6f1027fe068244e88c690048ad759613'
              expression: 'min(/DocSearch application/es.cluster.noeuds,10m)<{$DOCSEARCH.ES.NOEUDS.ATTENDUS}'
              name: 'Elasticsearch : le cluster n''a plus ses {$DOCSEARCH.ES.NOEUDS.ATTENDUS} nœuds'
              priority: HIGH
              description: |
                Avec 2 nœuds de données et 1 arbitre, la perte d'un nœud laisse le
                quorum tenable ; la perte d'un second l'anéantit (plus d'élection de
                master possible). Vérifier aussi que le port 9300 est ouvert entre
                les 3 machines.
              tags:
                - tag: scope
                  value: elasticsearch

        - uuid: '6a81b3023f3e436b9d7d2cd514b33f26'
          name: 'Cluster ES : nœuds de données'
          type: DEPENDENT
          key: 'es.cluster.noeuds.donnees'
          value_type: UNSIGNED
          master_item:
            key: 'es.cluster.sante'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.number_of_data_nodes'
          tags:
            - tag: composant
              value: elasticsearch

        - uuid: 'f3109c9ef0d042f19e957cbc74766c16'
          name: 'Cluster ES : shards non assignés'
          type: DEPENDENT
          key: 'es.cluster.shards.non_assignes'
          value_type: UNSIGNED
          master_item:
            key: 'es.cluster.sante'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.unassigned_shards'
          tags:
            - tag: composant
              value: elasticsearch
          triggers:
            - uuid: 'd1e3244ee54d464c9f8f490f2c59fdba'
              expression: 'min(/DocSearch application/es.cluster.shards.non_assignes,20m)>0'
              name: 'Elasticsearch : des shards restent non assignés depuis 20 min'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: elasticsearch

        - uuid: '56d7a9f8c09e417789e641a3ce890fd2'
          name: 'Cluster ES : shards actifs'
          type: DEPENDENT
          key: 'es.cluster.shards.pct'
          value_type: FLOAT
          units: '%'
          master_item:
            key: 'es.cluster.sante'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.active_shards_percent_as_number'
          tags:
            - tag: composant
              value: elasticsearch

        - uuid: '9eae4852f6414fc993a8c511b1a6b0df'
          name: 'Cluster ES : tâches en attente'
          type: DEPENDENT
          key: 'es.cluster.taches'
          value_type: UNSIGNED
          master_item:
            key: 'es.cluster.sante'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.number_of_pending_tasks'
          tags:
            - tag: composant
              value: elasticsearch
          triggers:
            - uuid: 'bbc0d0adebfa4784aeaebc00cd2f42f3'
              expression: 'min(/DocSearch application/es.cluster.taches,10m)>50'
              name: 'Elasticsearch : file de tâches du master engorgée'
              priority: WARNING
              description: 'Le master n''absorbe plus les changements d''état : créations d''index et bascules de shards traînent.'
              tags:
                - tag: scope
                  value: elasticsearch

        - uuid: 'fcc3e1c8afc54bdd852a83494aeda342'
          name: 'Cluster ES : nœud master'
          type: HTTP_AGENT
          key: 'es.cluster.master'
          url: '{$DOCSEARCH.ES.URL}/_cat/master'
          query_fields:
            - name: format
              value: json
          delay: 2m
          timeout: 15s
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].node'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: composant
              value: elasticsearch
          triggers:
            - uuid: '518434f2698846da8a84dfe7bf6a3a1d'
              expression: 'change(/DocSearch application/es.cluster.master)<>0 and length(last(/DocSearch application/es.cluster.master))>0'
              name: 'Elasticsearch : le nœud master a changé'
              priority: WARNING
              manual_close: 'YES'
              description: |
                Une élection a eu lieu. Isolé, c'est bénin (redémarrage d'un nœud).
                Répété, c'est un réseau instable entre les 3 machines, et le cluster
                passe son temps à se réorganiser au lieu de servir.
              tags:
                - tag: scope
                  value: elasticsearch

        - uuid: '9ac0275023cc48969bebcca2af399df9'
          name: 'Cluster ES : index passés en lecture seule'
          type: HTTP_AGENT
          key: 'es.cluster.lecture_seule'
          url: '{$DOCSEARCH.ES.URL}/_all/_settings/index.blocks.read_only_allow_delete'
          query_fields:
            - name: flat_settings
              value: 'true'
          delay: 5m
          timeout: 15s
          value_type: UNSIGNED
          description: |
            Elasticsearch pose ce verrou tout seul quand le disque dépasse le
            seuil haut, et NE LE RETIRE PAS quand la place revient. L'indexation
            s'arrête alors définitivement, sans erreur ailleurs que dans les
            journaux des workers.
            Levée : PUT /_all/_settings {"index.blocks.read_only_allow_delete": null}
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), n = 0;
                  for (var i in d) {
                      var s = d[i].settings || {};
                      if (String(s['index.blocks.read_only_allow_delete']) === 'true') n++;
                  }
                  return n;
          tags:
            - tag: composant
              value: elasticsearch
          triggers:
            - uuid: '3f4bc09c318b4d78917faae374ccdb49'
              expression: 'last(/DocSearch application/es.cluster.lecture_seule)>0'
              name: 'Elasticsearch : des index sont bloqués en lecture seule'
              priority: DISASTER
              description: |
                Verrou de seuil disque. Libérer de la place PUIS lever le verrou à la
                main — Elasticsearch ne le fait pas de lui-même.
              tags:
                - tag: scope
                  value: elasticsearch

        - uuid: '4538b7832d2b4bb6bf755029bf83d7ad'
          name: 'Cluster ES : documents dans l''alias fédéré'
          type: HTTP_AGENT
          key: 'es.documents.total'
          url: '{$DOCSEARCH.ES.URL}/{$DOCSEARCH.ES.ALIAS}/_count'
          delay: 5m
          timeout: 15s
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.count'
          tags:
            - tag: composant
              value: application
          triggers:
            - uuid: '435c9c4eeba844e1baab8c1121279cdb'
              expression: 'change(/DocSearch application/es.documents.total)<-{$DOCSEARCH.DOCS.CHUTE.MAX}'
              name: 'DocSearch : chute brutale du nombre de documents indexés'
              priority: HIGH
              manual_close: 'YES'
              description: |
                Attendu après une purge volontaire (manage.sh purge-path) ou une
                réindexation. Inattendu autrement : index supprimé, alias amputé
                d'un index, ou source retirée par erreur.
              tags:
                - tag: scope
                  value: application

        # ── Agrégats inter-machines ────────────────────────────
        - uuid: 'c69ab77a67d04b2f9eb4c3dc9ff88a6d'
          name: 'Agrégat : instances Tika joignables'
          type: CALCULATED
          key: 'docsearch.agr.tika'
          params: 'sum(last_foreach(/*/net.tcp.service[http,,9998]?[group="DocSearch/ingestion"]))+sum(last_foreach(/*/net.tcp.service[http,,9999]?[group="DocSearch/ingestion"]))'
          delay: 2m
          value_type: UNSIGNED
          description: 'Les 6 serveurs Tika des 3 machines d''ingestion, vus d''un bloc.'
          tags:
            - tag: composant
              value: tika
          triggers:
            - uuid: '51e715c36db849a4a00823fbd8647d88'
              expression: 'max(/DocSearch application/docsearch.agr.tika,10m)=0'
              name: 'Ingestion : plus AUCUNE instance Tika dans tout le cluster'
              priority: HIGH
              description: 'Plus aucun document ne peut être extrait, sur aucune machine. L''indexation est à l''arrêt.'
              tags:
                - tag: scope
                  value: tika
            - uuid: '4657e9a8328b43e780a743410690aead'
              expression: 'max(/DocSearch application/docsearch.agr.tika,10m)<{$DOCSEARCH.TIKA.MIN}'
              name: 'Ingestion : moins de {$DOCSEARCH.TIKA.MIN} instances Tika sur {$DOCSEARCH.TIKA.ATTENDUS}'
              priority: WARNING
              dependencies:
                - name: 'Ingestion : plus AUCUNE instance Tika dans tout le cluster'
                  expression: 'max(/DocSearch application/docsearch.agr.tika,10m)=0'
              tags:
                - tag: scope
                  value: tika

        - uuid: '0d97605a731f46af93edeb95aeacbb23'
          name: 'Agrégat : watchers actifs dans le cluster'
          type: CALCULATED
          key: 'docsearch.agr.watchers'
          params: 'sum(last_foreach(/*/docsearch.unite.actif[docsearch-watcher.service]?[group="DocSearch/ingestion"]))'
          delay: 2m
          value_type: UNSIGNED
          description: |
            Doit valoir EXACTEMENT 1. Le watcher est un singleton installé sur
            ingest-1 seulement (install-units.sh ingest --with-singletons).
            Aucune machine ne peut détecter seule qu'une autre en fait tourner
            un second : seul cet agrégat le voit.
          tags:
            - tag: composant
              value: ingestion
          triggers:
            - uuid: 'e3407140d9ac4cb58513a377f7b97b33'
              expression: 'last(/DocSearch application/docsearch.agr.watchers)>1'
              name: 'Ingestion : PLUSIEURS watchers tournent en même temps'
              priority: HIGH
              description: |
                Chaque fichier est publié deux fois sur Kafka, donc extrait et indexé
                deux fois : charge doublée sur Tika et sur Elasticsearch.
                Cause : install-units.sh ingest --with-singletons lancé sur plus
                d'une machine. Arrêter et désinstaller l'unité en trop.
              tags:
                - tag: scope
                  value: ingestion
            - uuid: '53746c91fbdc4120b59ddbf15d6d9763'
              expression: 'max(/DocSearch application/docsearch.agr.watchers,10m)=0'
              name: 'Ingestion : aucun watcher actif dans le cluster'
              priority: AVERAGE
              description: |
                Plus de détection temps réel : les nouveaux documents n'arriveront
                qu'au prochain scan complet. La recherche n'est pas affectée.
              tags:
                - tag: scope
                  value: ingestion

        - uuid: '82719c4a00b94445a4dbcb18dc6c580d'
          name: 'Agrégat : workers d''indexation dans le cluster'
          type: CALCULATED
          key: 'docsearch.agr.workers'
          params: 'sum(last_foreach(/*/docsearch.unites.workers?[group="DocSearch/ingestion"]))'
          delay: 2m
          value_type: UNSIGNED
          tags:
            - tag: composant
              value: ingestion
          triggers:
            - uuid: '7303ab0e7c744edb9ce278d4b6604fc2'
              expression: 'max(/DocSearch application/docsearch.agr.workers,15m)<{$DOCSEARCH.WORKERS.MIN}'
              name: 'Ingestion : moins de {$DOCSEARCH.WORKERS.MIN} workers actifs dans le cluster'
              priority: WARNING
              description: |
                Configuration par défaut : 3 workers sur chacune des 3 machines
                d'ingestion. En dessous, l'indexation ralentit sans s'arrêter.
              tags:
                - tag: scope
                  value: ingestion

        - uuid: '602c6e29b8594867877416f5917646bf'
          name: 'Agrégat : documents en attente d''indexation'
          type: CALCULATED
          key: 'docsearch.agr.retard'
          params: 'sum(last_foreach(/*/docsearch.kafka.retard?[group="DocSearch/kafka"]))'
          delay: 2m
          value_type: UNSIGNED
          tags:
            - tag: composant
              value: ingestion

        - uuid: '76246607b75b4740b7879311c398c9cb'
          name: 'Agrégat : unités systemd en échec dans le cluster'
          type: CALCULATED
          key: 'docsearch.agr.unites.echouees'
          params: 'sum(last_foreach(/*/docsearch.unites.echouees?[group="DocSearch"]))'
          delay: 2m
          value_type: UNSIGNED
          description: 'Vue d''ensemble pour le tableau de bord : le détail est sur chaque machine.'
          tags:
            - tag: composant
              value: systemd

        - uuid: 'ad47a7502cd64097bff07bf102537668'
          name: 'Agrégat : conteneurs malades dans le cluster'
          type: CALCULATED
          key: 'docsearch.agr.conteneurs.malsains'
          params: 'sum(last_foreach(/*/docsearch.conteneurs.malsains?[group="DocSearch"]))'
          delay: 2m
          value_type: UNSIGNED
          tags:
            - tag: composant
              value: podman
